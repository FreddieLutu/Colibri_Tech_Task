resources:
  jobs:
    wind_pipeline_job:
      name: wind-pipeline-${bundle.target}

      tasks:
        - task_key: ingest_clean
          python_wheel_task:
            package_name: wind_pipeline
            entry_point: ingest_clean
            named_parameters:
              source-volume: ${var.source_volume}
              catalog: ${var.catalog}
          environment_key: pipeline_env

        - task_key: summarise
          depends_on:
            - task_key: ingest_clean
          python_wheel_task:
            package_name: wind_pipeline
            entry_point: summarise
            named_parameters:
              catalog: ${var.catalog}
          environment_key: pipeline_env

        - task_key: detect_anomalies
          depends_on:
            - task_key: summarise
          python_wheel_task:
            package_name: wind_pipeline
            entry_point: detect_anomalies
            named_parameters:
              catalog: ${var.catalog}
              std-threshold: "2.0"
          environment_key: pipeline_env

      environments:
        - environment_key: pipeline_env
          spec:
            environment_version: "2"
            dependencies:
              - ../dist/*.whl

      schedule:
        quartz_cron_expression: "0 0 6 * * ?"   # 06:00 UTC daily
        timezone_id: UTC
        pause_status: PAUSED                    # unpause once the pipeline is green

      # Notify the deployer if a run fails. Replace with your team alias for
      # prod, or remove entirely while you're iterating.
      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}